<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <radialGradient id="beanShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#73381c"/>
      <stop offset="35%" stop-color="#4a1e0d"/>
      <stop offset="70%" stop-color="#2a0f06"/>
      <stop offset="100%" stop-color="#140602"/>
    </radialGradient>
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110502"/>
      <stop offset="50%" stop-color="#080201"/>
      <stop offset="100%" stop-color="#140602"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <g filter="url(#softGlow)">
    <!-- Cuerpo del Grano de Café -->
    <path d="M 60 10 
             C 95 10, 115 45, 115 80 
             C 115 120, 95 150, 60 150 
             C 25 150, 5 120, 5 80 
             C 5 45, 25 10, 60 10 Z" 
          fill="url(#beanShine)"/>
    
    <!-- Reflejo Especular Superior -->
    <path d="M 35 25 
             C 50 20, 75 22, 85 30 
             C 80 38, 55 35, 35 25 Z" 
          fill="#944d28" opacity="0.35"/>

    <!-- Hendidura / Fisura Central en S del Grano Tostado -->
    <path d="M 60 14 
             C 58 35, 52 55, 62 78 
             C 72 100, 64 125, 59 146" 
          stroke="url(#creaseGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
          
    <path d="M 60 14 
             C 58 35, 52 55, 62 78 
             C 72 100, 64 125, 59 146" 
          stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
          
    <!-- Bisel de Luz en el Borde de la Fisura -->
    <path d="M 64 25 
             C 61 45, 57 60, 66 80 
             C 75 102, 69 122, 64 138" 
          stroke="#693015" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
